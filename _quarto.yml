project:
  type: default
  output-dir: _site

format:
  revealjs:
    theme: [default]
    footer: "TAG2027 — Relación Suelo Agua Planta | UDLA"
    lang: es
    slide-number: c/t
    code-line-numbers: true
    code-block-bg: "#f5f5f5"
    width: 1280
    height: 720
    margin: 0.1
    center: true
    transition: slide
    fig-width: 9
    fig-height: 5
    fig-dpi: 150

execute:
  echo: true
  warning: false
  message: false

lang: es
